plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.knowledgeapplication'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'com.google.genai:google-genai:1.75.0'
    implementation platform('software.amazon.awssdk:bom:2.31.54')
    implementation 'software.amazon.awssdk:s3'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:testcontainers'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Never inherit an enabled production embedding provider into integration tests.
    systemProperty 'app.embedding.enabled', 'false'
    systemProperty 'app.ask.enabled', 'false'
    systemProperty 'app.gemini.api-key', ''
    environment 'GEMINI_API_KEY', ''
    environment 'GOOGLE_API_KEY', ''
    environment 'EMBEDDING_ENABLED', 'false'
    environment 'ASK_ENABLED', 'false'
    systemProperty 'retrieval.eval.report-directory', layout.buildDirectory.dir('reports/retrieval-eval').get().asFile.absolutePath
}

tasks.register('retrievalEval', Test) {
    description = 'Evaluate synthetic offline retrieval through real PostgreSQL/pgvector and write reports.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching 'com.knowledgeapplication.api.retrieval.eval.RetrievalEvaluationIntegrationTest' }
    outputs.upToDateWhen { false }
}

// Deliberately NOT a Test task or a dependency of test/check/build/CI.
tasks.register('retrievalEvalLive', JavaExec) {
    description = 'Explicitly approved manual Gemini embedding evaluation on isolated synthetic fixtures only.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.knowledgeapplication.api.retrieval.eval.LiveRetrievalMain'
    systemProperty 'retrieval.eval.live-task', 'true'
    systemProperty 'retrieval.eval.report-directory', layout.buildDirectory.dir('reports/retrieval-eval').get().asFile.absolutePath
    doFirst {
        if (System.getenv('RETRIEVAL_EVAL_LIVE') != 'true') {
            throw new GradleException('Manual live evaluation requires RETRIEVAL_EVAL_LIVE=true; no provider calls made.')
        }
    }
}
