plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.knowledgeapplication'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'com.google.genai:google-genai:1.75.0'
    implementation platform('software.amazon.awssdk:bom:2.31.54')
    implementation 'software.amazon.awssdk:s3'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:testcontainers'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Never inherit an enabled production embedding provider into integration tests.
    systemProperty 'app.embedding.enabled', 'false'
    systemProperty 'app.ask.enabled', 'false'
    systemProperty 'app.ai.metadata.enabled', 'false'
    systemProperty 'app.gemini.api-key', ''
    environment 'GEMINI_API_KEY', ''
    environment 'GOOGLE_API_KEY', ''
    environment 'EMBEDDING_ENABLED', 'false'
    environment 'ASK_ENABLED', 'false'
    environment 'AI_METADATA_ENABLED', 'false'
    systemProperty 'retrieval.eval.report-directory', layout.buildDirectory.dir('reports/retrieval-eval').get().asFile.absolutePath
    systemProperty 'metadata.eval.test-classpath', sourceSets.test.runtimeClasspath.asPath
}

tasks.register('retrievalEval', Test) {
    description = 'Evaluate synthetic offline retrieval through real PostgreSQL/pgvector and write reports.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching 'com.knowledgeapplication.api.retrieval.eval.RetrievalEvaluationIntegrationTest' }
    outputs.upToDateWhen { false }
}

// Deliberately NOT a Test task or a dependency of test/check/build/CI.
tasks.register('retrievalEvalLive', JavaExec) {
    description = 'Explicitly approved manual Gemini embedding evaluation on isolated synthetic fixtures only.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.knowledgeapplication.api.retrieval.eval.LiveRetrievalMain'
    systemProperty 'retrieval.eval.live-task', 'true'
    systemProperty 'retrieval.eval.report-directory', layout.buildDirectory.dir('reports/retrieval-eval').get().asFile.absolutePath
    doFirst {
        if (System.getenv('RETRIEVAL_EVAL_LIVE') != 'true') {
            throw new GradleException('Manual live evaluation requires RETRIEVAL_EVAL_LIVE=true; no provider calls made.')
        }
    }
}

tasks.register('metadataEval', JavaExec) {
    description = 'Deterministic synthetic summary/tag benchmark; no credentials or provider calls.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.knowledgeapplication.api.metadata.eval.MetadataEvalMain'
    environment 'GEMINI_API_KEY', ''
    environment 'GOOGLE_API_KEY', ''
    environment 'AI_METADATA_ENABLED', 'false'
    systemProperty 'app.gemini.api-key', ''
    systemProperty 'app.ai.metadata.enabled', 'false'
    systemProperty 'metadata.eval.report-directory', layout.buildDirectory.dir('reports/metadata-eval').get().asFile.absolutePath
    outputs.upToDateWhen { false }
}

// Keep prior live outputs byte-for-byte: required for explicitly approved future resume.
// Delete compiled/build files, but never recursively delete the protected report directories.
tasks.named('clean', Delete) {
    setDelete(provider {
        fileTree(layout.buildDirectory).matching {
            exclude 'reports/metadata-eval/live-*'
            exclude 'reports/metadata-eval/live-runs/**'
        }.files
    })
}

tasks.register('metadataEvalResumeCheck', JavaExec) {
    description = 'Read-only offline compatibility/count check for an explicitly supplied resume report; no provider or DB.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.knowledgeapplication.api.metadata.eval.MetadataResumeCheckMain'
    environment 'GEMINI_API_KEY', ''
    environment 'GOOGLE_API_KEY', ''
    systemProperty 'app.gemini.api-key', ''
}

// Always offline, explicit frozen baseline path only; never constructs a live adapter/context/DB.
tasks.register('metadataEvalCalibrate', JavaExec) {
    description = 'Re-score the same completed synthetic metadata outputs with versioned v1/v2 evaluation; zero provider calls.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.knowledgeapplication.api.metadata.eval.MetadataEvalCalibrateMain'
    environment 'GEMINI_API_KEY', ''
    environment 'GOOGLE_API_KEY', ''
    environment 'AI_METADATA_ENABLED', 'false'
    systemProperty 'app.gemini.api-key', ''
    systemProperty 'app.ai.metadata.enabled', 'false'
    systemProperty 'metadata.eval.report-directory', layout.buildDirectory.dir('reports/metadata-eval').get().asFile.absolutePath
    outputs.upToDateWhen { false }
}

// Manual JavaExec only: NEVER wired into test/check/build/CI.
tasks.register('metadataEvalLive', JavaExec) {
    description = 'Explicit opt-in, bounded synthetic Gemini metadata evaluation using the production adapter.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.knowledgeapplication.api.metadata.eval.MetadataEvalLiveMain'
    systemProperty 'metadata.eval.live-task', 'true'
    systemProperty 'metadata.eval.report-directory', layout.buildDirectory.dir('reports/metadata-eval').get().asFile.absolutePath
    doFirst {
        if (System.getenv('METADATA_EVAL_LIVE') != 'true') {
            throw new GradleException('Manual evaluation requires METADATA_EVAL_LIVE=true; no provider calls made.')
        }
    }
}
