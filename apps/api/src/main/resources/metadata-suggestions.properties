# Separate feature defaults: never edit the user's local secret-bearing application.yml.
app.ai.metadata.enabled=${AI_METADATA_ENABLED:false}
app.ai.metadata.model=${AI_METADATA_MODEL:gemini-3.5-flash-lite}
app.ai.metadata.base-url=${AI_METADATA_BASE_URL:https://generativelanguage.googleapis.com}
app.ai.metadata.connect-timeout=${AI_METADATA_CONNECT_TIMEOUT:PT5S}
app.ai.metadata.read-timeout=${AI_METADATA_READ_TIMEOUT:PT30S}
app.ai.metadata.max-output-tokens=${AI_METADATA_MAX_OUTPUT_TOKENS:600}
app.ai.metadata.max-content-chars=${AI_METADATA_MAX_CONTENT_CHARS:32000}
app.ai.metadata.quota.enabled=${AI_METADATA_QUOTA_ENABLED:true}
app.ai.metadata.quota.requests-per-minute=${AI_METADATA_RPM_LIMIT:10}
app.ai.metadata.quota.input-tokens-per-minute=${AI_METADATA_TPM_LIMIT:200000}
app.ai.metadata.quota.requests-per-day=${AI_METADATA_RPD_LIMIT:400}
app.ai.metadata.quota.token-estimate-chars-per-token=${AI_METADATA_TOKEN_ESTIMATE_CHARS_PER_TOKEN:2.5}
app.ai.metadata.quota.daily-reset-zone=${AI_METADATA_RPD_RESET_ZONE:America/Los_Angeles}
