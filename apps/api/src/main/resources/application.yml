spring:
  application:
    name: knowledge-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:knowledge_app}
    username: ${DB_USERNAME:knowledge_app}
    password: ${DB_PASSWORD:knowledge_app}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: ${KNOWLEDGE_IMAGE_MAX_SIZE:10MB}
      max-request-size: ${KNOWLEDGE_IMAGE_MAX_SIZE:10MB}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            scope:
              - openid
              - profile
              - email

app:
  owner-id: ${APP_OWNER_ID:00000000-0000-0000-0000-000000000001}
  knowledge:
    revision-checkpoint-interval: ${KNOWLEDGE_REVISION_INTERVAL:PT5M}
    image-max-size: ${KNOWLEDGE_IMAGE_MAX_SIZE:10MB}
    image-max-dimension: ${KNOWLEDGE_IMAGE_MAX_DIMENSION:20000}
    image-max-pixels: ${KNOWLEDGE_IMAGE_MAX_PIXELS:100000000}
  object-storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${OBJECT_STORAGE_BUCKET}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY}
    path-style: ${OBJECT_STORAGE_PATH_STYLE:true}
  auth:
    allowed-email: ${AUTH_ALLOWED_EMAIL:owner@example.com}
    web-base-url: ${WEB_BASE_URL:http://localhost:3000}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.web.servlet.DispatcherServlet: INFO
