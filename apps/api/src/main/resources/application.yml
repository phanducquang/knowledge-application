spring:
  application:
    name: knowledge-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:knowledge_app}
    username: ${DB_USERNAME:knowledge_app}
    password: ${DB_PASSWORD:knowledge_app}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: ${KNOWLEDGE_IMAGE_MAX_SIZE:10MB}
      max-request-size: ${KNOWLEDGE_IMAGE_MAX_SIZE:10MB}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            scope:
              - openid
              - profile
              - email

app:
  owner-id: ${APP_OWNER_ID:00000000-0000-0000-0000-000000000001}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  ai:
    quota-cleanup:
      enabled: ${AI_QUOTA_CLEANUP_ENABLED:true}
      minute-retention: ${AI_QUOTA_MINUTE_RETENTION:P2D}
      daily-retention: ${AI_QUOTA_DAILY_RETENTION:P30D}
      interval: ${AI_QUOTA_CLEANUP_INTERVAL:PT6H}
      initial-delay: ${AI_QUOTA_CLEANUP_INITIAL_DELAY:PT10M}
      batch-size: ${AI_QUOTA_CLEANUP_BATCH_SIZE:1000}
  embedding:
    enabled: ${EMBEDDING_ENABLED:false}
    base-url: ${EMBEDDING_BASE_URL:https://generativelanguage.googleapis.com}
    model: ${EMBEDDING_MODEL:gemini-embedding-2}
    dimensions: ${EMBEDDING_DIMENSIONS:768}
    connect-timeout: ${EMBEDDING_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${EMBEDDING_READ_TIMEOUT:PT30S}
    batch-size: ${EMBEDDING_BATCH_SIZE:16}
    indexing-enabled: ${EMBEDDING_INDEXING_ENABLED:true}
    interval: ${EMBEDDING_INDEX_INTERVAL:PT1M}
    initial-delay: ${EMBEDDING_INDEX_INITIAL_DELAY:PT30S}
    knowledge-batch-size: ${EMBEDDING_KNOWLEDGE_BATCH_SIZE:10}
    max-chunk-chars: ${EMBEDDING_MAX_CHUNK_CHARS:4000}
    overlap-chars: ${EMBEDDING_OVERLAP_CHARS:200}
    quota:
      enabled: ${EMBEDDING_QUOTA_ENABLED:true}
      requests-per-minute: ${EMBEDDING_RPM_LIMIT:80}
      input-tokens-per-minute: ${EMBEDDING_TPM_LIMIT:24000}
      requests-per-day: ${EMBEDDING_RPD_LIMIT:800}
      token-estimate-chars-per-token: ${EMBEDDING_TOKEN_ESTIMATE_CHARS_PER_TOKEN:2.5}
      daily-reset-zone: ${EMBEDDING_RPD_RESET_ZONE:America/Los_Angeles}
      background:
        requests-per-minute: ${EMBEDDING_BG_RPM_LIMIT:50}
        input-tokens-per-minute: ${EMBEDDING_BG_TPM_LIMIT:18000}
        requests-per-day: ${EMBEDDING_BG_RPD_LIMIT:650}
  ask:
    enabled: ${ASK_ENABLED:false}
    base-url: ${ASK_BASE_URL:https://generativelanguage.googleapis.com}
    model: ${ASK_MODEL:gemini-3.5-flash-lite}
    connect-timeout: ${ASK_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${ASK_READ_TIMEOUT:PT45S}
    max-output-tokens: ${ASK_MAX_OUTPUT_TOKENS:1200}
    max-context-chars: ${ASK_MAX_CONTEXT_CHARS:24000}
    max-chunks: ${ASK_MAX_CHUNKS:8}
    max-chunks-per-knowledge: ${ASK_MAX_CHUNKS_PER_KNOWLEDGE:2}
    max-sources: ${ASK_MAX_SOURCES:6}
    quota:
      enabled: ${ASK_QUOTA_ENABLED:true}
      requests-per-minute: ${ASK_RPM_LIMIT:10}
      input-tokens-per-minute: ${ASK_TPM_LIMIT:200000}
      requests-per-day: ${ASK_RPD_LIMIT:400}
      token-estimate-chars-per-token: ${ASK_TOKEN_ESTIMATE_CHARS_PER_TOKEN:2.5}
      daily-reset-zone: ${ASK_RPD_RESET_ZONE:America/Los_Angeles}
  knowledge:
    revision-checkpoint-interval: ${KNOWLEDGE_REVISION_INTERVAL:PT5M}
    image-max-size: ${KNOWLEDGE_IMAGE_MAX_SIZE:10MB}
    image-max-dimension: ${KNOWLEDGE_IMAGE_MAX_DIMENSION:20000}
    image-max-pixels: ${KNOWLEDGE_IMAGE_MAX_PIXELS:100000000}
    attachment-cleanup:
      enabled: ${KNOWLEDGE_ATTACHMENT_CLEANUP_ENABLED:true}
      grace-period: ${KNOWLEDGE_ATTACHMENT_ORPHAN_GRACE_PERIOD:PT24H}
      interval: ${KNOWLEDGE_ATTACHMENT_CLEANUP_INTERVAL:PT1H}
      initial-delay: ${KNOWLEDGE_ATTACHMENT_CLEANUP_INITIAL_DELAY:PT5M}
      batch-size: ${KNOWLEDGE_ATTACHMENT_CLEANUP_BATCH_SIZE:100}
  object-storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${OBJECT_STORAGE_BUCKET}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY}
    path-style: ${OBJECT_STORAGE_PATH_STYLE:true}
  auth:
    allowed-email: ${AUTH_ALLOWED_EMAIL:owner@example.com}
    web-base-url: ${WEB_BASE_URL:http://localhost:3000}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.web.servlet.DispatcherServlet: INFO
