services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: knowledge_app
      POSTGRES_USER: knowledge_app
      POSTGRES_PASSWORD: knowledge_app
    ports:
      - "5432:5432"
    volumes:
      - knowledge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_app -d knowledge_app"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-knowledge_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-for-local-development}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - knowledge-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-knowledge_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-for-local-development}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-knowledge-images}
    entrypoint: >-
      /bin/sh -c '
      /usr/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
      /usr/bin/mc mb --ignore-existing "local/$${OBJECT_STORAGE_BUCKET}";
      /usr/bin/mc anonymous set none "local/$${OBJECT_STORAGE_BUCKET}";
      '
    restart: "no"

volumes:
  knowledge-postgres-data:
  knowledge-minio-data:
